<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unordered List</title>
</head>
<body>
<p>Unordered List: list and group related items for better readability</p>
<ul>
    <li>Banana</li>
    <li>Mango</li>
</ul>

<p>Ordering list: List the items by numbering them</p>
<ol>
    <li>Laptop</li>
    <li>Computer</li>
</ol>
</body>
</html>
