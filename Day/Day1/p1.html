<html lang="en">
<head>
    <title>Image tag example</title>
</head>
<body>
    <!-- Image tag: -->
    <img src="dog_image.jpg" alt="The image of a dog">
    <!-- src: source | alt: alternative -->
    <!-- Image type: jpg/jpeg | png | webp | gif -->
    <img src="dog_image.jpg" alt="The image of a dog" width="40px" height="50px">
    <img src="dog_image.jpg" alt="The image of a dog" title=""My name is Tom">
</body>
</html>
